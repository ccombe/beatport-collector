# SonarCloud analysis settings for beatport-collector.
#
# Project key is auto-detected from the repository, so it is deliberately
# absent here — setting it wrong would create a duplicate project.

# S8786 flags regexes by *shape* ("a leading \s+/\s* run", lazy and greedy
# quantifiers), not by measurement, and it cannot see a `(?<!\s)` lookbehind.
#
# All five title patterns in beatport_collector/matching.py were genuinely
# quadratic and are now genuinely linear. Each leading whitespace run carries
# a `(?<!\s)` lookbehind so it cannot start mid-run, and the two ambiguous
# inner runs are bounded. Measured on the adversarial shapes in
# tests/test_regex_linearity.py: doubling the input now costs ~2x where it
# previously cost ~4x, and the worst case at n=16000 went from >3s to 0.14s.
#
# That test asserts the growth factor, so if a future edit makes one of these
# slow again it fails the suite rather than waiting for a reviewer to
# re-benchmark. The suppressions below exist only because the static rule
# still matches the shape; do not treat them as permission to leave a slow
# pattern in place.
#
# If a name below ever stops matching the `(?<!\s)` shape, delete its entry
# and let the finding come back.
sonar.issue.ignore.multicriteria=e1 \
  -q,RULE:python:S8786,matching.py:TITLE_SUFFIXES \
  -q,RULE:python:S8786,matching.py:SIMPLE_TITLE_SUFFIX \
  -q,RULE:python:S8786,matching.py:DASH_SUFFIX \
  -q,RULE:python:S8786,matching.py:FEAT_PATTERN

sonar.sourceEncoding=UTF-8
