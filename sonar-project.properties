# SonarCloud analysis settings for beatport-collector.
#
# Project key is auto-detected from the repository, so it is deliberately
# absent here — setting it wrong would create a duplicate project.

# S8786 flags regexes by *shape* (a leading \s+/\s* run, lazy and greedy
# quantifiers) rather than by measurement, and it cannot see a "(?<!\s)"
# lookbehind. Every title pattern in beatport_collector/matching.py was
# genuinely quadratic; all are now genuinely linear.
#
# The fix, in two parts:
#   * "(?<!\s)" on every leading whitespace run, so it cannot start mid-run.
#     Without it the engine retries from every offset inside a run and
#     rescans it each time. A mid-string run survives clean_title's strip(),
#     so this was reachable from real tag data.
#   * "{0,120}" caps on the two ambiguous inner runs (the lazy scan in
#     TITLE_SUFFIXES, the greedy scan in ALL_PAREN_CONTENT).
#
# Worst case at n=16000 went from over 3s to 0.14s, and the growth factor
# from ~4.0 (quadratic) to ~2.0 (linear). tests/test_regex_linearity.py
# asserts that growth factor against the adversarial shapes, so an edit that
# reintroduces backtracking fails the suite rather than waiting for a
# reviewer to notice. Equivalence was checked over the title corpus, 20736
# exhaustive short strings, and 30000 random titles.
#
# So this suppression is not permission to leave a slow pattern here — it is
# a statement that the rule's premise no longer applies. The whole file is
# excluded because it is pure string functions and S8786 in it is always
# about these five regexes. Delete this block if that stops being true.
sonar.issue.ignore.multicriteria=e1 \
  -q,RULE:S8786,FILE:**/matching.py

sonar.sourceEncoding=UTF-8
