[project]
name = "beatport-collector"
version = "0.1.0"
description = "Extract your Beatport purchase history into CSV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "mutagen>=1.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatport_collector"]

[tool.uv.sources]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
beatport-collector = "beatport_collector.cli:main"
