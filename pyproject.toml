[project]
name = "beatport-collector"
version = "0.1.0"
description = "Extract your Beatport purchase history into CSV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "mutagen>=1.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatport_collector"]

[tool.uv.sources]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ty]
# Astral ty: strict-ish defaults; run `uv run --group dev ty check src/`
# (or `uvx ty check src/` when the venv is for another platform).

[project.scripts]
beatport-collector = "beatport_collector.cli:main"
