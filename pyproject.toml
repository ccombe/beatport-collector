[project]
name = "beatport-collector"
version = "0.1.0"
description = "Extract your Beatport purchase history into CSV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "mutagen>=1.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatport_collector"]

[tool.uv.sources]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "mutmut>=3.0",
    "hypothesis>=6.0",
]

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Prose is never asserted: mutating it only produces noise survivors. Log
# text, argparse help strings, and console banners are docs, not behaviour.
# Returned strings that tests *do* assert (the progress line) are not print
# statements, so they stay under mutation.
do_not_mutate_patterns = [
    'logger\\.\\w+',
    'help=',
    'description=',
    'metavar=',
    # TOML literal string: one backslash, so the regex sees an escaped paren.
    '^\s*print\(',
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ty]
# Astral ty: strict-ish defaults; run `uv run --group dev ty check src/`
# (or `uvx ty check src/` when the venv is for another platform).

[project.scripts]
beatport-collector = "beatport_collector.cli:main"
