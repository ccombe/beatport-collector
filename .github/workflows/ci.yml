name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The library tooling is used from both Windows and WSL, so both
        # platforms have to stay green.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install project
        run: uv sync --all-groups --frozen

      # Every uv run below carries three flags, none of them optional:
      #   --frozen    never re-resolve, so CI runs the locked versions
      #                (Sonar S8544)
      #   --no-sync   never touch the environment; the sync step above
      #                already installed everything
      #   --no-build  never invoke the build backend (Sonar S8541)
      # --no-build alone is not enough: on its own uv still tries to install
      # the project, and refuses because an editable distribution has no
      # binary to install. --no-sync is what makes the pair work, so do not
      # drop one and keep the other.
      - name: Lint (ruff)
        run: uv run --frozen --no-sync --no-build ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run --frozen --no-sync --no-build ruff format --check src/ tests/

      - name: Types (ty)
        run: uv run --frozen --no-sync --no-build ty check src/ tests/

      - name: Tests + coverage (100% floor)
        # Tests needing a real music library or purchase CSV skip cleanly
        # when BPC_LIBRARY_DIR is unset, so this is self-contained.
        #
        # --cov is folded in here rather than run as a second step: it is the
        # same suite, and pytest-cov reads fail_under from
        # [tool.coverage.report] and exits non-zero below it, so this fails the
        # job either way. Running it twice cost ~26s per matrix leg for nothing.
        run: uv run --frozen --no-sync --no-build pytest -q --cov
